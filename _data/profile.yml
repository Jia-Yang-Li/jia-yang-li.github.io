bio_en: >-
  I am a PhD candidate in AI security and privacy at the University of
  Technology Sydney (UTS), advised by Prof. Tianqing Zhu. I expect to graduate
  in 2027.


  My research studies the security risks of fine-tuned language models and
  memory-augmented agents. I design and evaluate attacks and defences for the
  LLM supply chain, such as malicious adapters and inference-time attacks. I
  also work on verifying whether private data was used in training, and on
  auditing whether machine unlearning really removes the influence of the
  targeted data.
bio_zh: |-
  我是悉尼科技大学(UTS)人工智能安全与隐私方向的博士生，导师为朱天清教授，预计 2027 年毕业。

  我的研究关注微调语言模型和LLM智能体的安全风险。我设计并评估面向大模型供应链的攻击与防御，例如恶意适配器和推理时攻击；同时研究如何验证私有数据是否被用于训练，以及如何审计机器遗忘是否真正消除了目标数据的影响。

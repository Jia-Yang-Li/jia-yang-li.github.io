summary_en: PhD candidate in AI security and privacy. My research focuses on security risks in fine-tuned language models and memory-augmented agents. I design and evaluate attacks and defences, verify the use of private training data, and audit whether machine unlearning removes the influence of targeted data.
summary_zh: 人工智能安全与隐私方向博士生，研究聚焦微调语言模型与记忆增强智能体的安全风险。我设计并评估攻击与防御方法，验证私有训练数据的使用情况，并审计机器遗忘是否消除了目标数据的影响。
